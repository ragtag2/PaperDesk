apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperdesk-backend
  namespace: paperdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperdesk-backend
  template:
    metadata:
      labels:
        app: paperdesk-backend
    spec: 
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/ragtag2/paperdesk-backend:sha-f8f3222e7d250ae99750ba2a0ccbaeee2964527a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: paperdesk-backend
          env:
            - name: MONGODB_DB_NAME
              value: paperdesk
            - name: FRONTEND_ORIGIN
              value: http://172.20.10.2:30081
            - name: TRUST_PROXY
              value: "0"
            - name: AGENT_BASE_URL
              value: http://paperdesk-agent:8000
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paperdesk-backend
  namespace: paperdesk
spec:
  type: NodePort
  selector:
    app: paperdesk-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperdesk-frontend
  namespace: paperdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperdesk-frontend
  template:
    metadata:
      labels:
        app: paperdesk-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/ragtag2/paperdesk-frontend:sha-f8f3222e7d250ae99750ba2a0ccbaeee2964527a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paperdesk-frontend
  namespace: paperdesk
spec:
  type: NodePort
  selector:
    app: paperdesk-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
