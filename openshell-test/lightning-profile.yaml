id: paperdesk-lightning-013
display_name: Paperdesk Lightning
description: Paperdesk Chat Completions through Lightning
category: inference
inference_capable: true
credentials:
  - name: api_key
    env_vars: [AGENT_MODEL_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: lightning.ai
    port: 443
    path: /api/v1/**
    protocol: rest
    enforcement: enforce
    rules:
      - allow:
          method: POST
          path: /api/v1/chat/completions
binaries:
  - /usr/local/bin/python3.12
