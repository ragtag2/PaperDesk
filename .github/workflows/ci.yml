name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Chrome and browser dependencies
        run: npx playwright install --with-deps chrome

      - name: Run browser tests
        run: npm run test:e2e -- --workers=1

  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - "27018:27017"
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test
  agent:
    name: Agent tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agents/requirements.txt
            agents/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r agents/requirements-dev.txt

      - name: Run agent tests
        run: python -m unittest discover -s agents/tests -v
  images:
    name: Publish ARM64 images
    needs: [frontend, backend, agent]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ragtag2/paperdesk-frontend:sha-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ragtag2/paperdesk-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish agent
        uses: docker/build-push-action@v7
        with:
          context: ./agents
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ragtag2/paperdesk-agent:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
  deploy:
    name: Deploy to Pi
    needs: images
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, ARM64, paperdesk-pi]
    timeout-minutes: 15

    concurrency:
      group: paperdesk-production
      cancel-in-progress: false

    env:
      KUBECONFIG: /home/rayen/.kube/paperdesk-ci.yaml

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Deploy published images
        shell: bash
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$GITHUB_SHA" != "$latest_sha" ]]; then
            echo "Skipping a commit superseded on main."
            exit 0
          fi

          deploy_dir="$(mktemp -d "$RUNNER_TEMP/paperdesk.XXXXXX")"
          cp k8s/paperdesk.yaml k8s/agent.yaml "$deploy_dir/"

          cat > "$deploy_dir/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - paperdesk.yaml
            - agent.yaml
          images:
            - name: ghcr.io/ragtag2/paperdesk-frontend
              newTag: sha-${GITHUB_SHA}
            - name: ghcr.io/ragtag2/paperdesk-backend
              newTag: sha-${GITHUB_SHA}
            - name: ghcr.io/ragtag2/paperdesk-agent
              newTag: sha-${GITHUB_SHA}
          EOF

          kubectl apply -k "$deploy_dir"

          for service in agent backend frontend; do
            kubectl rollout status \
              -n paperdesk deployment/paperdesk-$service \
              --timeout=240s
          done

          kubectl get pods -n paperdesk